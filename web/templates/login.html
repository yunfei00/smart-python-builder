<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · Smart Python Builder</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="shell"><header class="header"><div><h1>Smart Python Builder</h1><p class="subtitle">管理员登录</p></div><a href="/">返回构建</a></header><section class="login"><h2>登录管理后台</h2>{% if initialized %}<form method="post" action="/admin/login"><label for="password">管理员密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required><div class="actions"><button>登录</button></div></form>{% else %}<p class="notice">管理员尚未初始化，请设置 BUILDER_ADMIN_PASSWORD，然后重启服务。</p>{% endif %}<p class="error" role="alert">{{ error }}</p><small>仅供可信内部管理员使用。登录会话八小时后过期。</small></section></main></body></html>
