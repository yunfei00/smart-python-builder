<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>经验审核 · Smart Python Builder</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;background:#f1f5f2;color:#17312c}section{background:white;padding:24px;margin:20px 0;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;height:240px}button,input{padding:10px;margin:8px}#error{color:#a32424}</style></head><body><h1>构建经验审核</h1><p>候选经验只有经过批准，才能影响后续项目。默认仅匹配相同源码与依赖声明。</p><input id="token" type="password" placeholder="管理员访问凭证"><button id="load">加载经验</button><p id="error"></p><main id="items"></main><script>
const $=id=>document.getElementById(id);async function api(path,options={}){options.headers={...(options.headers||{}),Authorization:'Bearer '+$('token').value};let r=await fetch(path,options),data=await r.json();if(!r.ok)throw Error(data.detail||'操作失败');return data}
async function load(){try{$('items').replaceChildren();for(let item of await api('/api/admin/experiences')){let section=document.createElement('section'),title=document.createElement('h2'),details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');title.textContent=item.id+' · '+item.status;summary.textContent='查看失败计划、诊断、成功计划与适用条件';pre.textContent=JSON.stringify(item,null,2);details.append(summary,pre);section.append(title,details);if(item.status==='CANDIDATE'){let edit=document.createElement('textarea');edit.value=JSON.stringify(item.repair_plan,null,2);section.append(edit);for(let [label,decision] of [['批准（采用当前编辑）','APPROVED'],['拒绝','REJECTED']]){let button=document.createElement('button');button.textContent=label;button.onclick=async()=>{try{await api('/api/admin/experiences/'+item.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,repair_plan:JSON.parse(edit.value)})});load()}catch(e){$('error').textContent=e.message}};section.append(button)}}$('items').append(section)}}catch(e){$('error').textContent=e.message}}$('load').onclick=load;
</script></body></html>
