<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Python Builder</title>
<style>
:root{--ink:#17312c;--muted:#62756e;--brand:#156550;--brand2:#23876d;--panel:rgba(255,255,255,.94);--line:rgba(21,101,80,.12)}
*{box-sizing:border-box}html{min-height:100%}body{font:16px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);margin:0;min-height:100vh;background:linear-gradient(135deg,#dff4ec 0%,#eef7f3 35%,#edf3ff 70%,#e7f0ff 100%);position:relative;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:-1}body:before{width:420px;height:420px;left:-180px;top:80px;background:radial-gradient(circle,rgba(35,135,109,.20),rgba(35,135,109,0) 70%)}body:after{width:520px;height:520px;right:-220px;top:220px;background:radial-gradient(circle,rgba(82,119,220,.18),rgba(82,119,220,0) 70%)}
.shell{width:min(1040px,calc(100% - 40px));margin:0 auto;padding:54px 0 70px}.hero{padding:8px 8px 20px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.58);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--brand);backdrop-filter:blur(8px)}.eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:#27a47f;box-shadow:0 0 0 5px rgba(39,164,127,.12)}h1{font-size:clamp(34px,5vw,50px);line-height:1.08;margin:18px 0 12px;letter-spacing:-.035em}.subtitle{font-size:18px;color:var(--muted);margin:0;max-width:650px;line-height:1.7}
section{background:var(--panel);border:1px solid rgba(255,255,255,.78);border-radius:22px;padding:28px 30px;margin:20px 0;box-shadow:0 18px 55px rgba(27,72,61,.09);backdrop-filter:blur(12px)}h2{font-size:21px;margin:0 0 18px}.step{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#e6f4ef;color:var(--brand);font-size:14px;margin-right:9px}
button,.download{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;border:0;border-radius:11px;padding:11px 22px;cursor:pointer;text-decoration:none;font-weight:650;box-shadow:0 7px 18px rgba(21,101,80,.16);transition:transform .15s ease,box-shadow .15s ease}button:hover,.download:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(21,101,80,.22)}button:disabled{opacity:.5;transform:none;cursor:not-allowed}select,input{padding:12px;border:1px solid #cfddd8;border-radius:10px;background:white;color:var(--ink)}input[type=file]{max-width:100%;margin-right:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto;background:#f4f8f6;border:1px solid #e1ebe7;border-radius:12px;padding:16px;line-height:1.55}small{color:var(--muted)}#error{color:#a32424;font-weight:600}label{display:block;margin:14px 0}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 8px}.progress-details{margin-top:20px;border-top:1px solid #e5eeea;padding-top:16px}details summary{cursor:pointer;font-weight:650;color:#365c52}.meta{color:var(--muted);font-size:14px}
@media(max-width:640px){.shell{width:min(100% - 24px,1040px);padding-top:28px}section{padding:22px 18px;border-radius:18px}h1{font-size:36px}form button{margin-top:12px}.actions>*{width:100%}}
</style></head>
<body><main class="shell"><header class="hero"><span class="eyebrow">INTERNAL WINDOWS BUILDER</span><h1>把 Python 程序变成应用</h1><p class="subtitle">上传 Python 程序，自动分析依赖与入口，一键生成可以在 Windows 上运行的应用。</p></header>
<section><h2><span class="step">1</span>上传程序</h2><form id="upload"><input name="file" type="file" accept=".py,.zip" required><button>分析程序</button></form><p><small>支持单个 .py 文件或 ZIP 项目，最大 20 MB。仅用于可信内部项目。</small></p></section>
<section id="project" hidden><h2><span class="step">2</span>确认并生成</h2><p id="dependencies"></p><p id="type"></p><label>程序入口 <select id="entry"></select></label><label>下载格式 <select id="mode"><option value="onefile">单个可执行文件</option><option value="onedir">完整应用文件夹 ZIP</option></select></label><details><summary>查看构建计划</summary><pre id="plan"></pre></details><div class="actions"><button id="build">生成 Windows 应用</button></div></section>
<section id="progress" hidden><h2><span class="step">3</span>构建进度</h2><p id="status"></p><p id="ids" class="meta"></p><div class="actions"><a id="download" class="download" hidden>下载应用</a></div><details class="progress-details" open><summary>运行日志</summary><pre id="log"></pre></details></section><p id="error" role="alert"></p></main>
<script>
let job; const $=id=>document.getElementById(id);
async function api(url,options){let r=await fetch(url,options);let data=await r.json();if(!r.ok)throw Error(data.detail||'操作失败');return data}
$('upload').onsubmit=async e=>{e.preventDefault();$('error').textContent='';try{$('progress').hidden=true;$('download').hidden=true;job=await api('/api/uploads',{method:'POST',body:new FormData(e.target)});$('project').hidden=false;$('entry').replaceChildren();if(!job.entry){let o=new Option('请选择程序入口','');$('entry').add(o)}for(let v of job.entries)$('entry').add(new Option(v,v));$('dependencies').textContent='检测到的依赖：'+(job.dependencies.join(', ')||'无需额外依赖');$('type').textContent='应用类型：'+(job.plan?.app_type==='gui'?'图形界面':'控制台 / 待选择入口');$('plan').textContent=JSON.stringify(job.plan,null,2);$('build').disabled=false}catch(e){$('error').textContent=e.message}};
$('build').onclick=async()=>{try{if(!$('entry').value)throw Error('请先选择程序入口');let f=new FormData();f.set('entry',$('entry').value);f.set('mode',$('mode').value);await api('/api/jobs/'+job.id+'/build',{method:'POST',body:f});$('build').disabled=true;$('progress').hidden=false;poll()}catch(e){$('error').textContent=e.message}};
async function poll(){try{let j=await api('/api/jobs/'+job.id);$('status').textContent=({READY:'等待开始',QUEUED:'排队中',BUILDING:'正在生成应用',FAILED:'构建失败',AI_DIAGNOSING:'正在分析问题',AI_REPAIRING:'正在修复',REBUILDING:'正在重新生成',SUCCESS:'应用已生成',NEEDS_MANUAL_REVIEW:'需要人工检查',EXPIRED:'文件已过期'})[j.status]||j.status;$('ids').textContent='任务 ID：'+j.id+' / Build ID：'+(j.build_id||'准备中');$('plan').textContent=JSON.stringify(j.plan,null,2);$('log').textContent=(await api('/api/jobs/'+job.id+'/log')).text;if(j.status==='SUCCESS'&&j.terminal){$('download').hidden=false;$('download').href='/api/jobs/'+job.id+'/download'}else if(j.terminal&&['FAILED','NEEDS_MANUAL_REVIEW','EXPIRED'].includes(j.status)){$('error').textContent=j.error||'构建失败'}else setTimeout(poll,1500)}catch(e){$('error').textContent=e.message}}
async function preview(){if(!job||!$('entry').value)return;try{let plan=await api('/api/jobs/'+job.id+'/plan?entry='+encodeURIComponent($('entry').value)+'&mode='+$('mode').value);$('plan').textContent=JSON.stringify(plan,null,2);$('type').textContent='应用类型：'+(plan.app_type==='gui'?'图形界面':'控制台')}catch(e){$('error').textContent=e.message}}
$('entry').onchange=preview;$('mode').onchange=preview;
const existing=new URLSearchParams(location.search).get('job');if(existing){job={id:existing};$('progress').hidden=false;poll()}
</script></body></html>
