<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Python Builder</title><link rel="stylesheet" href="/static/app.css"><script src="/static/home.js?v=1.1.0" defer></script></head><body><main class="shell">
<header class="header"><div><h1>Smart Python Builder</h1><p class="subtitle">Python → Windows App</p></div><a href="/admin">管理员</a></header>
<section><h2>1. 导入程序</h2><form id="upload" class="upload"><input aria-label="Python 程序或 ZIP 项目" name="file" type="file" accept=".py,.zip" required><button>分析程序</button></form><p><small>支持单个 .py 文件或 ZIP 项目，最大 20 MB。</small></p><p class="meta">或者直接导入公开 GitHub 仓库</p><form id="github-import" class="upload"><input id="github-url" aria-label="GitHub 仓库地址" type="url" placeholder="https://github.com/owner/repository" required><input id="github-ref" aria-label="Branch Tag Commit" type="text" placeholder="Branch / Tag / Commit（可选）"><button>导入仓库</button></form><p><small>当前仅支持公开 github.com HTTPS 仓库；不会递归拉取 submodule。仅用于可信内部项目。</small></p></section>
<section id="project" hidden><h2>2. 确认并生成</h2><p id="dependencies"></p><p id="type"></p><label for="entry">程序入口</label><select id="entry"></select><label for="mode">下载格式</label><select id="mode"><option value="onefile">单个可执行文件</option><option value="onedir">完整应用文件夹 ZIP</option></select><details><summary>查看构建计划</summary><pre id="plan"></pre></details><div class="actions"><button id="build">生成 Windows 应用</button></div></section>
<section id="progress"><h2>3. 构建进度</h2><p id="status" class="status" role="status">等待开始</p><p id="ids" class="meta"></p><div class="actions"><button id="download" disabled>下载应用（构建完成后可用）</button></div><details class="progress-details" open><summary>运行日志</summary><pre id="log">上传程序后，构建日志将显示在这里。</pre></details></section><p id="error" role="alert"></p><footer>可信内部构建服务 · 构建文件定期清理，请及时下载。</footer></main></body></html>
