{% extends 'admin_base.html' %}
{% block scripts %}<script src="/static/users.js?v=admin-filters-1" defer></script>{% endblock %}
{% block content %}
<section class="admin-section">
  <div class="workspace-title">
    <div>
      <h2>用户管理</h2>
      <p>查看账号、套餐、额度与启用状态。TEST 为内部无限测试账号。</p>
    </div>
    <button id="refresh-users" class="secondary">刷新用户</button>
  </div>
  <div id="user-summary" class="workspace-stats admin-user-summary"></div>

  <div class="admin-filter-bar">
    <input id="user-search" type="search" maxlength="100" placeholder="搜索用户名或邮箱">
    <select id="user-plan-filter">
      <option value="">全部套餐</option>
      <option value="FREE">FREE</option>
      <option value="TEST">TEST</option>
    </select>
    <select id="user-state-filter">
      <option value="">全部状态</option>
      <option value="enabled">正常账号</option>
      <option value="disabled">停用账号</option>
    </select>
    <button id="apply-user-filter" class="secondary">筛选</button>
    <button id="clear-user-filter" class="secondary">清除</button>
  </div>

  <details class="admin-create-user">
    <summary>+ 添加用户</summary>
    <form id="create-user-form" class="admin-create-user-form">
      <div><label for="new-user-username">用户名 *</label><input id="new-user-username" minlength="2" maxlength="32" required autocomplete="off" placeholder="user_01"></div>
      <div><label for="new-user-email">邮箱（选填）</label><input id="new-user-email" type="email" maxlength="254" placeholder="user@example.com"></div>
      <div><label for="new-user-password">初始密码 *</label><input id="new-user-password" type="password" minlength="8" maxlength="128" required placeholder="至少 8 个字符"></div>
      <div><label for="new-user-plan">套餐</label><select id="new-user-plan"><option value="FREE">FREE</option><option value="TEST">TEST · 无限</option></select></div>
      <div><label for="new-user-quota">剩余额度</label><input id="new-user-quota" type="number" min="0" max="1000000" step="1" value="10000"></div>
      <div class="admin-create-user-action"><button>创建用户</button></div>
    </form>
    <p id="create-user-message" class="message" role="status"></p>
  </details>

  <div id="users" class="admin-user-list"></div>
</section>

<div id="password-modal" class="admin-modal" hidden>
  <div class="admin-modal-backdrop" data-close-password></div>
  <section class="admin-modal-card" role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
    <h3 id="password-modal-title">重置用户密码</h3>
    <p id="password-modal-user" class="meta"></p>
    <form id="password-reset-form">
      <label for="reset-user-password">新密码</label>
      <input id="reset-user-password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="至少 8 个字符">
      <label for="reset-user-password-confirm">确认新密码</label>
      <input id="reset-user-password-confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="再次输入新密码">
      <div class="actions"><button type="button" class="secondary" data-close-password>取消</button><button>重置密码</button></div>
    </form>
    <p id="password-reset-message" class="message" role="status"></p>
  </section>
</div>
{% endblock %}
