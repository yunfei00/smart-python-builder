name: Instrument Capture Studio Acceptance

on:
  push:
    branches:
      - feature/multi-app-build
    paths:
      - "analyzer/**"
      - "builder/**"
      - "web/**"
      - "tests/windows_portfolio_acceptance.py"
      - ".github/workflows/instrument-capture-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrument-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv
      - run: uv sync --frozen
      - name: Real GitHub import, build and smoke
        run: uv run python tests/windows_portfolio_acceptance.py --repository "https://github.com/yunfei00/instrument-capture-studio" --timeout 2400
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-capture-acceptance
          path: |
            workspace/portfolio-*/portfolio-result.json
            workspace/portfolio-*/download-smoke.log
            workspace/portfolio-*/**/build.log
          if-no-files-found: ignore
          retention-days: 7
