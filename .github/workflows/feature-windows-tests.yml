name: Feature Windows Tests

on:
  push:
    branches:
      - feature/multi-app-build
    paths:
      - "analyzer/**"
      - "builder/**"
      - "web/**"
      - "tests/**"
      - ".github/workflows/feature-windows-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check uv
      - run: uv sync --frozen
      - name: Run test suite
        run: uv run pytest -q
