[project]
name = "smart-python-builder"
version = "0.1.0"
description = "Build isolated Windows executables from Python sources"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["builder", "analyzer"]
